{% extends 'dashboard_base.html' %}

{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="panel narrow">
  <div class="section-head"><h3>Change Password</h3></div>
  <form method="post" class="stack" style="margin-top:14px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-block" type="submit">Update password</button>
  </form>
  <a class="btn btn-outline" href="{% url 'profile' %}" style="margin-top:12px;">Back</a>
</div>
{% endblock %}
