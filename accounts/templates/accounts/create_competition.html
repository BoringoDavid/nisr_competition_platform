{% load static %}
<link rel="stylesheet" href="{% static 'css/base.css' %}">
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">

<div class="dashboard">
  <section class="panel" style="max-width:600px;margin:40px auto;">
    <div class="section-head"><h3>Create Competition</h3></div>
    <form method="post" style="display:grid;gap:14px;margin-top:14px;">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Create</button>
      <a class="btn btn-outline" href="{% url 'admin_dashboard' %}">Cancel</a>
    </form>
  </section>
</div>
